# docker-compose.yml
version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db # Persist MongoDB data

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"] # Enable AOF persistence
    volumes:
      - redis_data:/data # Persist Redis data

  app:
    build: .
    container_name: voting-app
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/votingapp # Use service name as hostname
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretjwtkeyforvotingapp # Or use a more secure secret
      PORT: 5000
    depends_on:
      - mongodb
      - redis
    # Mount your local code into the container for development (optional)
    # volumes:
    #   - .:/app
    #   - /app/node_modules # Prevents host's node_modules from overwriting container's

volumes:
  mongo_data:
  redis_data: